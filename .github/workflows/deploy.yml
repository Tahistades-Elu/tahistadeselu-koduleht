name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - run: npm run generate
        env:
          VITE_APPS_SCRIPT_URL: ${{ vars.APPS_SCRIPT_URL }}
          # The portal's public price feed (https://iseteenindus.tahistadeselu.ee/api/public/catalogue).
          # Set as a repo variable once production serves it; while it is empty the
          # committed snapshot in app/data/catalogue.json is used. When set, a feed that
          # fails or looks wrong fails the build, and the live site stays as it was.
          PORTAL_CATALOGUE_URL: ${{ vars.PORTAL_CATALOGUE_URL }}

      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
